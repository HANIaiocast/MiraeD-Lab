<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하루 3분, AI 트렌드 뉴스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>하루 3분, AI 트렌드 뉴스</h1>
        <button id="theme-toggle">다크 모드</button>
    </header>
    
    <main id="app">
        <section id="daily-summary" style="margin-bottom: 2rem; display: none;">
            <h2 style="color: var(--primary-color);">오늘의 AI 요약 (7:00 AM)</h2>
            <div id="summary-content" class="article" style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px var(--shadow);">
                <!-- 요약 내용이 여기에 들어갑니다 -->
            </div>
        </section>
        <div id="news-list"></div>
    </main>

    <template id="news-article-template">
        <style>
            .article {
                background: var(--card-bg);
                color: var(--text-color);
                margin-bottom: 1rem;
                padding: 1.5rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px var(--shadow);
                opacity: 0;
                transform: translateY(20px);
                animation: fadeIn 0.5s ease-out forwards;
                transition: background-color 0.3s, color 0.3s;
            }

            @keyframes fadeIn {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .article h2 {
                margin-top: 0;
                font-size: 1.5rem;
                color: var(--primary-color);
            }

            .article p {
                font-size: 1rem;
                line-height: 1.6;
            }

            .article a {
                text-decoration: none;
                color: var(--primary-color);
                font-weight: bold;
            }

            .value-tag {
                display: inline-block;
                background: var(--primary-color);
                color: white;
                padding: 0.2rem 0.6rem;
                border-radius: 4px;
                font-size: 0.8rem;
                margin-bottom: 0.5rem;
            }
        </style>
        <div class="article">
            <div class="value-tag"><slot name="value">가치평가</slot></div>
            <h2><slot name="title">Article Title</slot></h2>
            <p><slot name="content">Article content...</slot></p>
            <a href="#"><slot name="link">자세히 보기</slot></a>
        </div>
    </template>

    <script type="module" src="main.js"></script>
</body>
</html>
