<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insight Lab | 글로벌 AI 뉴스 큐레이션</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <header>
        <h1>AI INSIGHT LAB</h1>
        <button id="theme-toggle">테마 변경</button>
    </header>
    
    <main id="app">
        <section id="daily-summary" style="display: none;">
            <div class="summary-header">
                <span style="font-size: 1.8rem;">📢</span>
                <h2 id="summary-title" style="margin: 0; font-size: 1.6rem;">오늘의 AI 브리핑</h2>
            </div>
            <div id="summary-card-container" class="summary-card">
                <!-- 요약 내용 -->
            </div>
        </section>

        <h3 style="margin-bottom: 2rem; font-size: 1.4rem; font-weight: 800;">🌐 글로벌 주요 뉴스</h3>
        <div id="news-list" class="news-grid"></div>
        <section id="contact"> 
            <h3 style="margin-bottom: 0.5rem; font-size: 1.5rem; font-weight: 800;">🤝 제휴 및 문의</h3> 
            <p style="margin-bottom: 2rem; color: var(--text-secondary);">AI Insight Lab과 함께할 파트너를 찾습니다. 제안이나 문의사항을 남겨주세요.</p> 
            <form action="https://formspree.io/f/xzdwkpwn" method="POST"> 
                <div class="form-group"> 
                    <label for="name">성함 / 기업명</label> 
                    <input type="text" id="name" name="name" placeholder="홍길동 / 인사이트랩" required> 
                </div> 
                <div class="form-group"> 
                    <label for="email">이메일 주소</label> 
                    <input type="email" id="email" name="email" placeholder="example@email.com" required> 
                </div> 
                <div class="form-group"> 
                    <label for="message">문의 내용</label> 
                    <textarea id="message" name="message" rows="5" placeholder="제안하고자 하는 내용을 상세히 적어주세요." required></textarea> 
                </div> 
                <button type="submit" class="submit-btn">문의 보내기</button> 
            </form> 
            <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-secondary); text-align: center;"> 
                * Formspree를 통해 안전하게 전달됩니다. 
            </p> 
        </section>
    </main>

    <template id="news-article-template">
        <style>
            .article-card {
                background: var(--card-bg);
                border-radius: 20px;
                box-shadow: var(--shadow);
                border: 1px solid var(--border-color);
                overflow: hidden;
                display: flex;
                flex-direction: column;
                height: 100%;
                transition: transform 0.3s ease;
                opacity: 0;
                transform: translateY(20px);
                animation: fadeIn 0.6s forwards;
            }

            .article-card:hover {
                transform: translateY(-5px);
            }

            @keyframes fadeIn {
                to { opacity: 1; transform: translateY(0); }
            }

            .article-image {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-bottom: 1px solid var(--border-color);
            }

            .article-body {
                padding: 1.5rem;
                display: flex;
                flex-direction: column;
                flex-grow: 1;
            }

            .badge {
                align-self: flex-start;
                background: var(--primary-color);
                color: white;
                padding: 4px 12px;
                border-radius: 8px;
                font-size: 0.7rem;
                font-weight: 800;
                margin-bottom: 1rem;
            }

            h2 {
                margin: 0 0 1rem 0;
                font-size: 1.2rem;
                line-height: 1.5;
                font-weight: 700;
            }

            p {
                margin: 0 0 1.5rem 0;
                font-size: 0.95rem;
                color: var(--text-secondary);
                line-height: 1.6;
                flex-grow: 1;
            }

            .source-info {
                margin-top: auto;
                padding-top: 1rem;
                border-top: 1px solid var(--border-color);
            }

            .source-label {
                font-size: 0.75rem;
                font-weight: 700;
                color: var(--text-secondary);
                display: block;
                margin-bottom: 4px;
            }

            .source-url {
                font-size: 0.8rem;
                color: var(--primary-color);
                word-break: break-all;
                font-family: monospace;
                opacity: 0.8;
            }
        </style>
        <div class="article-card">
            <slot name="image"></slot>
            <div class="article-body">
                <div class="badge"><slot name="value">SOURCE</slot></div>
                <h2><slot name="title">Headline</slot></h2>
                <p><slot name="content">Description...</slot></p>
                <div class="source-info">
                    <span class="source-label">기사 출처 (Original Source)</span>
                    <div class="source-url"><slot name="source-url"></slot></div>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="main.js"></script>
</body>
</html>
