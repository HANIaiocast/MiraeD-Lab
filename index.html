<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하루 3분, 최신 트렌드 뉴스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>하루 3분, 최신 트렌드 뉴스</h1>
    </header>
    <main id="app"></main>

    <template id="news-article-template">
        <style>
            .article {
                background: #fff;
                margin-bottom: 1rem;
                padding: 1.5rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                opacity: 0;
                transform: translateY(20px);
                animation: fadeIn 0.5s ease-out forwards;
            }

            @keyframes fadeIn {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .article h2 {
                margin-top: 0;
                font-size: 1.5rem;
            }

            .article p {
                font-size: 1rem;
                line-height: 1.6;
            }

            .article a {
                text-decoration: none;
                color: #007bff;
                font-weight: bold;
            }
        </style>
        <div class="article">
            <h2><slot name="title">Article Title</slot></h2>
            <p><slot name="content">Article content...</slot></p>
            <a href="#"><slot name="link">자세히 보기</slot></a>
        </div>
    </template>

    <script type="module" src="main.js"></script>
</body>
</html>
