<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insight Lab | 전문 AI 뉴스 큐레이션</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <header>
        <h1>AI INSIGHT LAB</h1>
        <button id="theme-toggle">테마 변경</button>
    </header>
    
    <main id="app">
        <section id="daily-summary" style="display: none;">
            <div class="summary-header">
                <span style="font-size: 1.8rem;">📢</span>
                <h2 id="summary-title" style="margin: 0; font-size: 1.6rem;">오늘의 브리핑</h2>
            </div>
            <div id="summary-card-container" class="summary-card">
                <!-- 요약 내용이 여기에 들어갑니다 -->
            </div>
        </section>

        <h3 style="margin-bottom: 1.5rem; font-size: 1.3rem;">실시간 주요 뉴스</h3>
        <div id="news-list" class="news-grid"></div>
    </main>

    <template id="news-article-template">
        <style>
            .article-card {
                background: var(--card-bg);
                padding: 1.8rem;
                border-radius: 16px;
                box-shadow: var(--shadow);
                border: 1px solid var(--border-color);
                display: flex;
                flex-direction: column;
                height: 100%;
                transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                opacity: 0;
                transform: translateY(20px);
                animation: fadeIn 0.6s forwards;
            }

            .article-card:hover {
                transform: translateY(-8px);
                border-color: var(--primary-color);
            }

            @keyframes fadeIn {
                to { opacity: 1; transform: translateY(0); }
            }

            .badge {
                align-self: flex-start;
                background: var(--accent-color);
                color: var(--primary-color);
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 0.75rem;
                font-weight: 700;
                margin-bottom: 1rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            h2 {
                margin: 0 0 1rem 0;
                font-size: 1.25rem;
                line-height: 1.4;
                font-weight: 700;
                color: var(--text-color);
            }

            p {
                margin: 0 0 1.5rem 0;
                font-size: 0.95rem;
                color: var(--text-secondary);
                flex-grow: 1;
                line-height: 1.6;
            }

            .read-more {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                text-decoration: none;
                color: var(--primary-color);
                font-weight: 700;
                font-size: 0.9rem;
                transition: gap 0.2s;
            }

            .read-more:hover {
                gap: 10px;
            }
        </style>
        <div class="article-card">
            <div class="badge"><slot name="value">CATEGORY</slot></div>
            <h2><slot name="title">Headline</slot></h2>
            <p><slot name="content">Description...</slot></p>
            <slot name="link-anchor"></slot>
        </div>
    </template>

    <script type="module" src="main.js"></script>
</body>
</html>
