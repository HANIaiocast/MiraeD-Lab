<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하루 3분, AI 트렌드 뉴스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>하루 3분, AI 트렌드 뉴스</h1>
        <button id="theme-toggle">다크 모드</button>
    </header>
    
    <main id="app">
        <section id="daily-summary" style="margin-bottom: 2rem; display: none;">
            <h2 style="color: var(--primary-color); margin-bottom: 1rem;">오늘의 AI 퀵 요약 ⚡</h2>
            <div id="summary-content" class="article" style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow); border-left: 5px solid var(--primary-color);">
                <!-- 요약 내용이 여기에 들어갑니다 -->
            </div>
        </section>
        <div id="news-list"></div>
    </main>

    <template id="news-article-template">
        <style>
            .article {
                background: var(--card-bg);
                color: var(--text-color);
                margin-bottom: 1.5rem;
                padding: 1.5rem;
                border-radius: 12px;
                box-shadow: 0 4px 6px var(--shadow);
                opacity: 0;
                transform: translateY(20px);
                animation: fadeIn 0.5s ease-out forwards;
                transition: background-color 0.3s, color 0.3s, transform 0.2s;
            }

            .article:hover {
                transform: translateY(-2px);
            }

            @keyframes fadeIn {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .article h2 {
                margin: 0.5rem 0;
                font-size: 1.4rem;
                color: var(--primary-color);
            }

            .article p {
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 1.2rem;
            }

            .article a {
                display: inline-block;
                text-decoration: none;
                background: var(--primary-color);
                color: white;
                padding: 0.5rem 1.2rem;
                border-radius: 20px;
                font-weight: bold;
                font-size: 0.9rem;
                transition: opacity 0.2s;
            }

            .article a:hover {
                opacity: 0.9;
            }

            .value-tag {
                display: inline-block;
                background: var(--primary-color);
                color: white;
                padding: 0.2rem 0.6rem;
                border-radius: 4px;
                font-size: 0.75rem;
                font-weight: bold;
                text-transform: uppercase;
            }

            .summary-list {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            .summary-list li {
                margin-bottom: 0.8rem;
                padding-left: 1.5rem;
                position: relative;
            }
            .summary-list li::before {
                content: "•";
                color: var(--primary-color);
                position: absolute;
                left: 0;
                font-weight: bold;
            }
        </style>
        <div class="article">
            <div class="value-tag"><slot name="value">가치평가</slot></div>
            <h2><slot name="title">Article Title</slot></h2>
            <p><slot name="content">Article content...</slot></p>
            <slot name="link-anchor"></slot>
        </div>
    </template>

    <script type="module" src="main.js"></script>
</body>
</html>
